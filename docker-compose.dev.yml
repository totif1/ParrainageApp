# Configuration Docker Compose pour le développement
# Usage: docker-compose -f docker-compose.dev.yml up
version: '3.8'

services:
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: parrainage_frontend_dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-dev
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - parrainage_network

  backend-dev:
    image: php:8.2-apache
    container_name: parrainage_backend_dev
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - database-dev
    environment:
      - DB_HOST=database-dev
      - DB_NAME=parrainage_db
      - DB_USER=parrainage_user
      - DB_PASSWORD=parrainage_pass
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y libzip-dev zip unzip git &&
        docker-php-ext-install pdo pdo_mysql zip &&
        a2enmod rewrite &&
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer &&
        cd /var/www/html && composer install --no-dev --optimize-autoloader &&
        apache2-foreground
      "
    networks:
      - parrainage_network

  database-dev:
    image: mysql:8.0
    container_name: parrainage_db_dev
    environment:
      MYSQL_DATABASE: parrainage_db
      MYSQL_USER: parrainage_user
      MYSQL_PASSWORD: parrainage_pass
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - parrainage_network

  # Service pour les tests automatiques
  tests:
    image: alpine/curl
    container_name: parrainage_tests
    volumes:
      - ./test_api.sh:/test_api.sh
    depends_on:
      - backend-dev
    command: >
      sh -c "
        apk add --no-cache bash python3 &&
        chmod +x /test_api.sh &&
        /test_api.sh
      "
    networks:
      - parrainage_network

volumes:
  mysql_dev_data:

networks:
  parrainage_network:
    driver: bridge