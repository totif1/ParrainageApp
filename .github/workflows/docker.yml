# -----------------------------------------------------------------------------
#  Livraison continue de l'image Docker
#  Construit l'image de production (cible `prod` du Dockerfile) et la publie
#  sur GitHub Container Registry (ghcr.io) :
#    - à chaque push sur main          → tags `main` et `sha-xxxxxxx` + `latest`
#    - à chaque tag Git `vX.Y.Z`       → tags `X.Y.Z`, `X.Y`, `latest`
#
#  Récupérer l'image ensuite :
#    docker pull ghcr.io/<owner>/<repo>:latest
# -----------------------------------------------------------------------------
name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write   # nécessaire pour pousser sur ghcr.io

jobs:
  build-and-push:
    name: Build & push (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Buildx = builder avancé (multi-plateforme, cache distant…).
      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule automatiquement les tags et labels OCI de l'image.
      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod          # on ne publie que l'image de prod, pas celle de dev
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache des couches entre deux exécutions (accélère les builds).
          cache-from: type=gha
          cache-to: type=gha,mode=max
