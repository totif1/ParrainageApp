version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: parrainage_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: parrainage_db
      MYSQL_USER: parrainage_user
      MYSQL_PASSWORD: parrainage_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - parrainage_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "parrainage_user", "-pparrainage_password"]
      timeout: 20s
      retries: 10
      interval: 30s
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parrainage_backend
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_NAME=parrainage_db
      - DB_USER=parrainage_user
      - DB_PASSWORD=parrainage_password
      - APP_ENV=development
      - APP_DEBUG=true
    networks:
      - parrainage_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parrainage_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - parrainage_network

networks:
  parrainage_network:

volumes:
  mysql_data: