services:
  database:
    image: mysql:8.0
    container_name: parrainage_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: parrainage_db
      MYSQL_USER: parrainage_user
      MYSQL_PASSWORD: parrainage_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - parrainage_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: parrainage_backend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      database:
        condition: service_healthy
    environment:
      - DB_HOST=database
      - DB_NAME=parrainage_db
      - DB_USER=parrainage_user
      - DB_PASS=parrainage_password
    networks:
      - parrainage_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parrainage_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - parrainage_network

networks:
  parrainage_network:
    driver: bridge
    name: parrainage_network

volumes:
  mysql_data: