# Protection CSRF « stateless » pour les formulaires et le login/logout.
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout

# En test, le jeton stateless dépend d'un cookie posé par du JavaScript :
# on désactive la protection CSRF des formulaires pour pouvoir les soumettre
# depuis les tests fonctionnels.
when@test:
    framework:
        form:
            csrf_protection:
                enabled: false
